server:
  port: 8080

spring:
  application:
    name: port-schedule-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/db_port?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # SpringBoot3 标准redis路径，消除过时警告
  redis:
    data:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0